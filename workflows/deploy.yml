# ============================================================
# GITHUB ACTIONS WORKFLOW — CI/CD PIPELINE
# DevOps Home Lab Project #3 | Author: Chip Sineath
# ============================================================
# WHAT IS CI/CD?
#   CI = Continuous Integration: Every time you push code to GitHub,
#        automated tests run to make sure you didn't break anything.
#   CD = Continuous Deployment: If tests pass, code automatically
#        deploys to your server. Zero manual steps required.
#
# WHAT IS GITHUB ACTIONS?
#   GitHub's built-in automation platform. You write a YAML file that
#   says WHEN to run and WHAT to do. GitHub runs it for free on their
#   servers every time you push code.
#
# HOW TO READ THIS FILE:
#   YAML uses indentation (2 spaces) to define structure.
#   Anything after # is a comment (ignored by the system).
#   ${{ expression }} is GitHub Actions template syntax.
# ============================================================

name: CI/CD Pipeline — Build, Test, Deploy

# TRIGGERS: When does this pipeline run?
on:
  push:
    branches: [ main ]          # Every push to the main branch
  pull_request:
    branches: [ main ]          # Every pull request targeting main
  workflow_dispatch:             # Manual "Run workflow" button in GitHub UI

# GLOBAL ENVIRONMENT VARIABLES: Available in every job
env:
  DOCKER_USERNAME: chippa88
  IMAGE_NAME: devops-webapp

jobs:

  # ══════════════════════════════════════════════════════
  # JOB 1: LINT — Check code quality before wasting time testing
  # ══════════════════════════════════════════════════════
  lint:
    name: Lint and Validate
    runs-on: ubuntu-latest     # Fresh Ubuntu VM provided by GitHub

    steps:
      # Step 1: Download your code onto the runner machine
      # Without this step, the VM has no idea what's in your repo
      - name: Checkout code
        uses: actions/checkout@v4

      # Step 2: Validate YAML files (like this workflow file itself)
      - name: Validate YAML syntax
        run: |
          pip install yamllint --quiet
          find . -name "*.yml" -not -path "./.git/*" | xargs yamllint -d relaxed || true
          echo "YAML validation complete"

      # Step 3: Scan for accidentally committed secrets (passwords, API keys)
      # If a secret gets into git, it's compromised and must be rotated
      - name: Scan for hardcoded secrets
        run: |
          echo "Scanning for potential secrets..."
          # grep searches file contents. -r=recursive, -i=case insensitive, -n=show line numbers
          # We look for patterns like: password = "abc123" or api_key = "something"
          # || true prevents the step from failing if grep finds nothing (exit code 1 = no match)
          grep -rin --include="*.js" --include="*.ts" --include="*.sh" \
            -E "(password|api_key|secret)\s*[:=]\s*['\"][^'\"]{8,}" . \
            | grep -v "example\|sample\|TODO" || true
          echo "Scan complete"

  # ══════════════════════════════════════════════════════
  # JOB 2: TEST — Run automated tests
  # ══════════════════════════════════════════════════════
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    needs: lint                  # Only runs if lint JOB passes

    # MATRIX: Run this job multiple times with different Node versions
    # This ensures our app works on Node 18, 20, AND 22
    strategy:
      matrix:
        node-version: [18, 20, 22]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Install the specific Node.js version from our matrix
      # ${{ matrix.node-version }} is replaced with 18, 20, or 22
      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm                           # Cache downloaded packages for speed

      - name: Install dependencies
        run: |
          # Only run npm if a package.json exists in this project
          if [ -f package.json ]; then
            npm ci                             # ci = clean install, faster than npm install
          else
            echo "No package.json — skipping"
          fi

      - name: Run tests
        run: |
          if [ -f package.json ] && grep -q '"test"' package.json; then
            npm test
          else
            echo "Running basic file validation..."
            find . -name "*.html" | while read f; do
              [ -s "$f" ] && echo "PASS: $f" || echo "FAIL: $f is empty"
            done
          fi

  # ══════════════════════════════════════════════════════
  # JOB 3: BUILD — Create a Docker image of our app
  # ══════════════════════════════════════════════════════
  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Buildx is Docker's enhanced build system with caching support
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Log into Docker Hub to push our image
      # secrets.DOCKERHUB_TOKEN is stored in GitHub → Settings → Secrets
      # NEVER put real credentials directly in this file
      - name: Login to Docker Hub
        if: github.event_name == 'push'    # Only push on real commits, not PR checks
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Build the image AND push it to Docker Hub if we're on main
      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: ${{ github.ref == 'refs/heads/main' && github.event_name == 'push' }}
          tags: |
            ${{ env.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          # Reuse cached layers from previous builds — saves minutes per run
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ══════════════════════════════════════════════════════
  # JOB 4: DEPLOY — Push to production server via SSH
  # ══════════════════════════════════════════════════════
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: production      # Can require manual approval in GitHub settings

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          # GitHub secrets — set these in your repo Settings → Secrets → Actions
          host: ${{ secrets.SERVER_HOST }}        # Your server IP
          username: ${{ secrets.SERVER_USER }}    # SSH user (usually 'ubuntu')
          key: ${{ secrets.SERVER_SSH_KEY }}      # Content of your ~/.ssh/id_rsa file
          script: |
            # Pull the fresh image we just built
            docker pull ${{ env.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:latest

            # Remove the old running container
            # || true = don't fail if it doesn't exist yet
            docker stop devops-webapp || true
            docker rm devops-webapp || true

            # Start the new container
            # -d = detached (background), -p = port mapping, --restart = auto-restart on reboot
            docker run -d \
              --name devops-webapp \
              -p 80:80 \
              --restart unless-stopped \
              ${{ env.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:latest

            echo "Deployed successfully at $(date)"
            docker ps | grep devops-webapp
